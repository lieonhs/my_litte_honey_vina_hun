<style>
:root{--hdr:#2b2926;--hdrInk:#f4f1ec;--bg:#f3f2ef;--card:#fff;--ink:#1f1e1c;--mute:#6a665f;--line:#dcd8d0;--th:#ecebe7;--acc:#25646c;--accS:#e2eff0;--red:#b3261e;--redS:#fbe6e4;--amb:#8f5b00;--ambS:#fbf0d9;--grn:#1d6b3f;--grnS:#e3f1e8;--sel:#e9f2f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hdr:#121110;--hdrInk:#ece9e3;--bg:#181715;--card:#211f1d;--ink:#ebe8e2;--mute:#9e998f;--line:#3a3733;--th:#2a2825;--acc:#72c2cb;--accS:#1b3235;--red:#ff8a80;--redS:#3c1c1a;--amb:#f2b851;--ambS:#382c14;--grn:#7ccf9c;--grnS:#1a3022;--sel:#1f2c2e}}
:root[data-theme="dark"]{--hdr:#121110;--hdrInk:#ece9e3;--bg:#181715;--card:#211f1d;--ink:#ebe8e2;--mute:#9e998f;--line:#3a3733;--th:#2a2825;--acc:#72c2cb;--accS:#1b3235;--red:#ff8a80;--redS:#3c1c1a;--amb:#f2b851;--ambS:#382c14;--grn:#7ccf9c;--grnS:#1a3022;--sel:#1f2c2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
@media (max-width:860px){input,textarea,select{font-size:16px!important}}
img,video,iframe,svg{max-width:100%}
#view .region,#view .rb{max-width:100%;min-width:0}#view .rb:has(>table),#view .region:has(>table){overflow-x:auto;-webkit-overflow-scrolling:touch}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hdr);color:var(--hdrInk);height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;position:sticky;top:0;z-index:20}
header .ham{background:none;border:0;color:inherit;width:40px;height:40px;padding:0;min-height:0}
header .ham svg{width:22px;height:22px}
header .app{font-weight:600;font-size:15px;letter-spacing:.01em}
header .ent{margin-left:auto;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.layout{display:flex;max-width:1280px;margin:0 auto}
aside{width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);min-height:calc(100vh - 52px);padding:10px 0;position:sticky;top:52px;align-self:flex-start;max-height:calc(100vh - 52px);overflow-y:auto}
aside .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:12px 16px 4px}
aside a{display:block;padding:9px 16px;color:var(--ink);text-decoration:none;border-left:3px solid transparent;font-size:14px}
aside a.on{background:var(--sel);border-left-color:var(--acc);font-weight:600}
main{flex:1;min-width:0;padding:14px 18px 60px}
@media (max-width:860px){aside{position:fixed;left:0;top:52px;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}main{padding:12px 12px 60px}}
@media (min-width:861px){header .ham{display:none}}
.crumb{font-size:12px;color:var(--mute)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.ph h1{font-size:20px;margin:0;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.region{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:12px}
.region>.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;flex-wrap:wrap}
.region>.rb{padding:12px}
.region>.rb.flush{padding:0}
button,.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:7px 12px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button.pri,.btn.pri{background:var(--hdr);border-color:var(--hdr);color:var(--hdrInk);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri,:root:not([data-theme="light"]) .btn.pri{background:var(--acc);border-color:var(--acc);color:#0f1a1b}}
:root[data-theme="dark"] button.pri,:root[data-theme="dark"] .btn.pri{background:var(--acc);border-color:var(--acc);color:#0f1a1b}
button.sm{padding:3px 8px;min-height:28px;font-size:12.5px}
button.lnk{border:0;background:none;color:var(--acc);padding:0;min-height:0;text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-height:36px;width:100%}
@media (max-width:600px){input,select{font-size:16px}}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.fg .full{grid-column:1/-1}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--th);text-align:left;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;white-space:nowrap;color:var(--mute)}
tr.grp td{background:var(--bg);font-weight:600}
tr.sub td{font-weight:600;border-top:1px solid var(--ink)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
tr.bad td{background:var(--redS)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sel)}
.neg{color:var(--red)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--grnS);color:var(--grn)}.p-bad{background:var(--redS);color:var(--red)}.p-warn{background:var(--ambS);color:var(--amb)}.p-mute{background:var(--th);color:var(--mute)}
.msg{font-size:13px;padding:9px 12px;border-radius:4px;border-left:4px solid var(--acc);background:var(--accS);margin-bottom:12px}
.msg.err{border-color:var(--red);background:var(--redS);color:var(--red)}
.msg.warn{border-color:var(--amb);background:var(--ambS);color:var(--amb)}
.hide{display:none!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;border-top:3px solid var(--acc)}
.tile.bad{border-top-color:var(--red);background:var(--redS)}
.tile .k{font-size:12px;color:var(--mute)}.tile .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-all}
.tile.bad .v{color:var(--red)}
.tile .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.bar{height:6px;background:var(--th);border-radius:3px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--acc)}
.bar.w i{background:var(--amb)}.bar.r i{background:var(--red)}
.drop{border:2px dashed var(--line);border-radius:4px;padding:18px;text-align:center}
.drop.hov{border-color:var(--acc);background:var(--accS)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--mute)}
.tabs button.on{border-bottom-color:var(--acc);color:var(--ink);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters>div{min-width:150px}
.rpt-h{text-align:center;padding:12px 8px 6px}.rpt-h b{font-size:15px}.rpt-h div{font-size:12px;color:var(--mute)}
td.ind1{padding-left:22px}
.sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);width:100%;max-width:440px;border-radius:6px;overflow:hidden}
.sheet .sh{background:var(--th);padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.sheet .sb{padding:14px}
.sheet .sf{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:6px}
.jl input,.jl select{min-height:32px;padding:5px 7px}
.login{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.login .box{background:var(--card);border:1px solid var(--line);border-radius:6px;width:100%;max-width:360px;overflow:hidden}
@media print{header,aside,.acts,.filters,.tabs,#status{display:none!important}main{padding:0}}
</style></head><body>
